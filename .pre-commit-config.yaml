# Local checks only -- no hooks are fetched from remote repositories
# and nothing runs outside this machine.
#
#   pre-commit install            # once, to activate the git hook
#   pre-commit run --all-files    # manual run
repos:
  - repo: local
    hooks:
      - id: make-check
        name: make check (book builds, all examples render)
        entry: make check
        language: system
        pass_filenames: false
        always_run: true

      - id: codespell
        name: codespell (spelling check)
        entry: codespell
        language: system
        types: [text]
        exclude: ^(examples/data|images)/

      - id: no-tmprender-files
        name: no stray render temp files
        entry: temporary render files (tmprender*) must not be committed
        language: fail
        files: (^|/)tmprender
  - repo: https://github.com/hholzgra/asciidoc-linter/
    rev: 52e7fa5982d980eefd5b548f68ff6f58767fe772 # branch hholzgra-issues-52-54
    hooks:
      - id: asciidoc-linter
        name: AsciiDoc Linter
        description: Lint AsciiDoc files for common issues and style violations
        entry: asciidoc-linter
        language: python
        files: \.(adoc|asciidoc)$
        args: [--format, plain]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0  # Use the latest version
    hooks:
      - id: flake8
        name: flake8
        files: \.py$
