repos:
  - repo: https://github.com/hholzgra/asciidoc-linter/
    rev: 52e7fa5982d980eefd5b548f68ff6f58767fe772 # branch hholzgra-issues-52-54
    hooks:
      - id: asciidoc-linter
        name: AsciiDoc Linter
        description: Lint AsciiDoc files for common issues and style violations
        entry: asciidoc-linter
        language: python
        files: \.(adoc|asciidoc)$
        args: [--format, plain]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0  # Use the latest version
    hooks:
      - id: flake8
        name: flake8
        files: \.py$
